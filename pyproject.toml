[project]
name = "wordhunt"
version = "0.1.0"
description = "Word Hunt Analyzer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.48",
    "alembic>=1.20.1",
    "huey>=3.5.3",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["server/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["whcore", "app"]

[tool.ruff.lint.per-file-ignores]
"tools/make_review.py" = ["E501"]  # embedded HTML/CSS/JS template

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Header", "fastapi.Form", "fastapi.Query"]
